# Run from this directory:  docker compose up -d   (pulls the released image; upgrade: docker compose pull && docker compose up -d)
# Everything is configured in the web UI (Settings); there is no environment configuration.
services:
  nikon-camera-control:
    image: ghcr.io/metril/nikon-camera-control:0.2.0
    container_name: nikon-camera-control
    ports:
      - "8000:8000"
    restart: unless-stopped
    # USB access, narrowly (no --privileged, no extra capabilities):
    # - The whole /dev/bus/usb tree is BIND-MOUNTED (not `devices:`), so the container sees
    #   the new device node the camera gets after every replug or power cycle. `devices:`
    #   would only expose nodes that exist when the container starts.
    # - device_cgroup_rules allows the container to open USB character devices (major 189)
    #   and nothing else. Trade-off: every USB device node is visible to the container, not
    #   just the camera, because the node path changes on every replug.
    # - The container user (uid 1000) is not root, so it needs the group that owns the camera
    #   node on the HOST. group_add takes a NUMERIC gid: a group NAME would be looked up in
    #   the container's /etc/group (plugdev = 46 on Debian), not the host's. Find the gid with
    #   the camera plugged in:   stat -c %g /dev/bus/usb/BBB/DDD   (BBB/DDD from `lsusb`)
    #   docker/udev/99-nikon.rules sets that group (plugdev) on the node; on hosts where it is
    #   not 46 (or plugdev does not exist: Fedora, Arch) put the real gid here instead.
    device_cgroup_rules:
      - "c 189:* rmw"
    group_add:
      - "46"
    # No /var/run/dbus mount: libgphoto2 does not use it. The host's gvfs-gphoto2 monitor
    # may grab the camera; the udev rule marks it as not-a-media-player to prevent that.
    volumes:
      - /dev/bus/usb:/dev/bus/usb
      # Paths are relative to this file (docker/). Both must be writable by uid/gid 1000:
      #   mkdir -p data output && sudo chown 1000:1000 data output
      - ./data:/app/data      # config.json, api_key.json, presets, caches
      - ./output:/app/output  # captured photos, sessions, videos, recordings

  # Touchscreen kiosk on the host's HDMI output (no desktop needed on the host).
  # Enable with:  docker compose --profile kiosk up -d
  kiosk:
    profiles: [kiosk]
    image: ghcr.io/metril/nikon-camera-control-kiosk:0.2.0
    container_name: nikon-camera-control-kiosk
    restart: unless-stopped
    depends_on:
      nikon-camera-control:
        condition: service_healthy
    # Starts as root only for seatd, then drops to an unprivileged user for cage + Chromium.
    # No --privileged and no cap_add: seatd uses its "noop" backend (no VT switching), so it
    # needs no SYS_TTY_CONFIG/SYS_ADMIN.
    devices:
      - /dev/dri:/dev/dri
      - /dev/input:/dev/input
    # NUMERIC host gids (names would resolve inside the container). Find yours with:
    #   stat -c %g /dev/dri/card0 /dev/dri/renderD128 /dev/input/event0
    group_add:
      - "44"   # video : /dev/dri/card0
      - "992"  # render: /dev/dri/renderD128
      - "996"  # input : /dev/input/event*
    volumes:
      - /run/udev:/run/udev:ro  # libinput device discovery and hotplug
    tmpfs:
      - /tmp
