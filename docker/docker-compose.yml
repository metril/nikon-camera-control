# Run from this directory:  docker compose up -d --build
# Everything is configured in the web UI (Settings); there is no environment configuration.
services:
  nikon-camera-control:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: nikon-camera-control:latest
    container_name: nikon-camera-control
    ports:
      - "8000:8000"
    restart: unless-stopped
    # USB access, narrowly:
    # - Map only the USB bus tree (not --privileged, no extra capabilities).
    # - The container user (uid 1000) is NOT root, so it needs a group that can open the
    #   device nodes. docker/udev/99-nikon.rules makes the camera node 0660 root:plugdev on
    #   the host; "plugdev" here is resolved against the HOST group list by name only if
    #   it exists there, otherwise use the numeric gid (`getent group plugdev`).
    # Trade-off: /dev/bus/usb exposes every USB device node to the container, not just the
    # camera, because the node path changes on every replug and compose cannot follow it.
    # Replug recovery works without restarting the container. If you want it tighter, map
    # the single node (/dev/bus/usb/BBB/DDD) and restart the container after each replug.
    devices:
      - /dev/bus/usb:/dev/bus/usb
    group_add:
      - plugdev
    # No /var/run/dbus mount: libgphoto2 does not use it. The host's gvfs-gphoto2 monitor
    # may grab the camera; the udev rule marks it as not-a-media-player to prevent that.
    volumes:
      # Paths are relative to this file (docker/). Both must be writable by uid/gid 1000:
      #   mkdir -p data output && sudo chown 1000:1000 data output
      - ./data:/app/data      # config.json, api_key.json, presets, caches
      - ./output:/app/output  # captured photos, sessions, videos, recordings
