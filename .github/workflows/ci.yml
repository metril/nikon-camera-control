name: ci

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"
      - run: python -m venv .venv && .venv/bin/pip install -r requirements-dev.txt
      - run: cd frontend && bun install --frozen-lockfile
      - run: .venv/bin/ruff check .
      - run: .venv/bin/ruff format --check .
      - run: .venv/bin/mypy backend scripts
      - run: make api-check
      - run: cd frontend && bun run lint
      - run: cd frontend && bun run format:check

  backend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [unit, api, integration, drift]
        include:
          - shard: unit
            path: tests/unit
          - shard: api
            path: tests/api
          - shard: integration
            path: tests/integration
          - shard: drift
            path: tests/test_api_drift.py
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m venv .venv && .venv/bin/pip install -r requirements-dev.txt
      - run: .venv/bin/pytest ${{ matrix.path }} -n auto

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"
      - run: cd frontend && bun install --frozen-lockfile
      - run: cd frontend && bun run test
      - run: cd frontend && bun run build

  # Playwright layout tests against the demo camera, split across shards.
  layout:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: ["1/2", "2/2"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"
      - run: python -m venv .venv && .venv/bin/pip install -r requirements-dev.txt
      - run: cd frontend && bun install --frozen-lockfile
      - run: cd frontend && bun run build
      - run: cd frontend && bunx playwright install --with-deps chromium
      - run: cd frontend && bunx playwright test --shard=${{ matrix.shard }}

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # The single required status check: fails unless every job above succeeded.
  ci-ok:
    if: always()
    needs: [lint, backend, frontend, layout, docker]
    runs-on: ubuntu-latest
    steps:
      - name: Require all jobs to succeed
        run: |
          echo '${{ toJSON(needs) }}'
          test "${{ needs.lint.result }}" = success \
            && test "${{ needs.backend.result }}" = success \
            && test "${{ needs.frontend.result }}" = success \
            && test "${{ needs.layout.result }}" = success \
            && test "${{ needs.docker.result }}" = success
